[project]
name = "mcp_qpgenerator"
version = "0.1.0"
description = "MCP server to generate question papers, convert to DOCX, and email them"
readme = "README.md"
authors = [
    { name = "Nikhil Khatri", email = "nikhilkhatri004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0,<2.3.0rc1",
    "python-docx>=1.1.0",
    "markdown>=3.6",
    "beautifulsoup4>=4.12.0",
    "uvicorn>=0.54.0",
    "spire-doc>=14.9.1",
]

[project.scripts]
mcp-question-paper = "mcp_qpgenerator:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
