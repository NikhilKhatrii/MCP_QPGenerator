[project]
name = "mcp-qpgenerator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikhil Khatri", email = "nikhilkhatri004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.10",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
]

[project.scripts]
mcp-qpgenerator = "mcp_qpgenerator.server:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
